[package]
name = "weather-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.7", features = ["macros"] }
deadpool-redis = "0.22.1"
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4.29"
redis = "0.32.7"
reqwest = "0.12.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.7", features = ["fs"] }
